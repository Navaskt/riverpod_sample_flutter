name: tiverpod_sample_flutter
description: "A new Flutter project."

publish_to: 'none' 

version: 1.0.0+1

environment:
    sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter

  flutter_riverpod: ^2.6.1
  dio: ^5.9.0
  retrofit: ^4.7.0
  freezed_annotation: ^3.1.0
  riverpod_annotation: ^2.6.1
  json_annotation: ^4.9.0
  go_router: ^16.2.0
  injectable: ^2.5.1
  get_it: ^8.2.0


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  riverpod_generator: ^2.6.5
  retrofit_generator: ^9.7.0
  freezed: ^3.1.0
  build_runner: ^2.5.4
  json_serializable: ^6.9.5
  injectable_generator: ^2.7.0



